name: Bug report
description: Report an error or unexpected behavior in ScriptWriter Pro.
labels:
  - bug
  - needs-triage
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Please search for existing issues before filing a new report.

  - type: input
    id: os
    attributes:
      label: Operating system and version
      description: Include the OS name and version you are running.
      placeholder: macOS 15.0 / Windows 11 / Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: The version of ScriptWriter Pro where the bug occurred.
      placeholder: 1.0.3
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps needed to trigger the issue.
      placeholder: |
        1. Open the app
        2. Create a new project
        3. Click on ...
        4. Observe the issue
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: Describe what actually happened, including any error messages.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recordings
      description: Add any screenshots, GIFs, or screen recordings that help explain the issue.
      placeholder: Drag and drop images here or paste links.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Include any terminal output, console logs, or crash reports.
      placeholder: Paste logs here.
    validations:
      required: false

  - type: input
    id: ai-provider
    attributes:
      label: AI provider (optional)
      description: If relevant, note the provider used (for example OpenAI, Gemini, or a custom endpoint). Do not paste API keys.
      placeholder: OpenAI / Gemini / DeepSeek / Anthropic / custom
    validations:
      required: false
