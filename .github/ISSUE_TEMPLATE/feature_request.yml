name: Feature request
description: Suggest an improvement or new capability for ScriptWriter Pro.
labels:
  - enhancement
  - needs-triage
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve?
      placeholder: Describe the workflow or workflow gap you are experiencing.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how the feature should work.
      placeholder: Outline the proposed behavior, UX, or workflow.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: Describe other options you considered and why they were not sufficient.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      placeholder: Add screenshots, references, or any extra details that help explain the request.
    validations:
      required: false

  - type: checkbox
    id: scope
    attributes:
      label: I have read and considered the "What it is not" section in the README.
      description: This helps keep feature requests aligned with the project’s scope.
      options:
        - label: I confirm that I have read and considered the project scope.
          required: true
